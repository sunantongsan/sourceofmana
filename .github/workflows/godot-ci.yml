name: Android test APK
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  builds:
    uses: ./.github/workflows/export.yml
    with:
      mode: debug
      targets: Android
  publish:
    needs: builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Android
          path: apk
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv 'apk/Source of Mana.apk' apk/XianWay-Mana-mobile-test.apk
          sha256sum apk/XianWay-Mana-mobile-test.apk > apk/SHA256SUMS.txt
          gh release create "mobile-test-${GITHUB_RUN_NUMBER}" apk/XianWay-Mana-mobile-test.apk apk/SHA256SUMS.txt --target "$GITHUB_SHA" --title "XianWay Mana Android test ${GITHUB_RUN_NUMBER}" --prerelease --notes 'Android ARM64 test build. Landscape layout, adaptive UI scaling, independent multitouch movement and attack. Starts with the existing offline mode; online still refers to the upstream test service, not a dedicated XianWay server. Original Mana content and English UI retained. Debug-signed testing APK; not a Play Store release.'
