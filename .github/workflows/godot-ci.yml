name: Android test APK
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  builds:
    uses: ./.github/workflows/export.yml
    with:
      mode: debug
      targets: Android
  publish:
    needs: builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Android
          path: apk
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv 'apk/Source of Mana.apk' apk/XianWay-Mana-mobile-test.apk
          sha256sum apk/XianWay-Mana-mobile-test.apk > apk/SHA256SUMS.txt
          gh release create "mobile-test-${GITHUB_RUN_NUMBER}" apk/XianWay-Mana-mobile-test.apk apk/SHA256SUMS.txt --target "$GITHUB_SHA" --title "XianWay Mana Android test ${GITHUB_RUN_NUMBER}" --prerelease --notes 'Android ARM64 test build 0.0.14. Quick HP/qi potion buttons with counts and shared cooldown; bag shortcut and live character portrait management screen. One skill point per level, persisted upgrades through rank 20, two wider area attacks. Light RPG supply shop with item icons, categories, detail pane and purchase totals.  All 40 original maps accessible through 44 waypoints with search. 25 level-balanced hunting maps and 15 safe maps; regional population caps and new spawns in previously empty hunting areas. Visible equipped weapons while walking and attacking; original flying sword size restored. Server-validated bounded melee follow-through fixes fleeing targets leaving reach during wind-up. Touch-select monster targeting. Town supply shop with healing, mana, antidote and starter gear. Visible automatically collected G rewards. Offline/authorized GM commands: gm g+1000, gm exp100x, gm exp1x. Monster EXP multiplier is session-only. Landscape layout, adaptive UI scaling, independent multitouch movement and attack. Starts with the existing offline mode; online still refers to the upstream test service, not a dedicated XianWay server. Thai core UI and bundled Sarabun font. Short equipment/combat/attribute training and an in-game Training Guide. Ten cultivation realms with ten layers each, ending at ปรมาจารย์เซียน. Circular attack and skill controls, selectable normal/skill auto, starter sword and three skills. Safe Tulimshar city with monsters relocated outside; south gate open. Eight named free waypoints, Thai travel menu and outdoor sword flight at 2.5x walking speed. Flight blocks combat and requires safe landing. Travel features are for offline testing. Existing art retained. Real directional cast poses and release frames. Moving weather removed. Monsters show level and HP, fade after death, and respawn after 8 seconds; spawn density increased. Level 1-100 hunting tiers and 17 waypoints, gold per kill, 3 attribute points per level, full vitality restoration on level-up. Clearer sword wind-up, fast strike and recovery, directional slash trails, hit sparks, violet qi shockwaves, jade sword formation and azure sword waves. Mobile effect count capped. Optional legacy quests and upstream online dialogue are not fully translated. Debug-signed testing APK; not a Play Store release.'
